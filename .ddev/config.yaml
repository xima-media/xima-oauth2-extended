name: xima-oauth2-extended
type: typo3
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
database:
  type: mariadb
  version: "10.11"
webimage_extra_packages: [libxml2-utils]
omit_containers: [ddev-ssh-agent]
disable_settings_management: true
web_environment:
  - TYPO3_CONTEXT=Development/DDEV
